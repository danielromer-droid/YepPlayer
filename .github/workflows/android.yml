name: YepPlayer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build YepPlayer
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.YEP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yepplayer-release.jks"
            echo "file=$RUNNER_TEMP/yepplayer-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key secret: building the debug APK only."
          fi

      - name: Build signed release APK
        if: steps.key.outputs.file != ''
        env:
          YEP_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          YEP_KEYSTORE_PASSWORD: ${{ secrets.YEP_KEYSTORE_PASSWORD }}
          YEP_KEY_ALIAS: ${{ secrets.YEP_KEY_ALIAS }}
          YEP_KEY_PASSWORD: ${{ secrets.YEP_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/YepPlayer-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs dist/YepPlayer-release.apk | head -5

      - name: Build debug APK
        if: steps.key.outputs.file == ''
        run: |
          # Also builds the optimised release variant (unsigned) so shrinking problems show up early.
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YepPlayer-debug.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yepplayer-release.jks"

      - name: Publish release with a direct download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.key.outputs.file != '' }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp dist/*.apk YepPlayer.apk
          if [ "$SIGNED" = "true" ]; then KIND="Signed release"; else KIND="Test build (not signed yet)"; fi
          gh release create "$TAG" YepPlayer.apk --target "$GITHUB_SHA" --title "YepPlayer $VERSION (build ${{ github.run_number }})" \
            --notes "$KIND. Always-latest download link: https://github.com/${{ github.repository }}/releases/latest/download/YepPlayer.apk"

      - name: Upload YepPlayer APK
        uses: actions/upload-artifact@v4
        with:
          name: YepPlayer-Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
